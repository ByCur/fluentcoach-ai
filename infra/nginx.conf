server {
  listen 8080;
  server_name _;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  access_log off;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  client_max_body_size 9m;
  root /usr/share/nginx/html;
  location = /health/live { access_log off; default_type application/json; return 200 '{"status":"ok","service":"web"}'; }
  location /api/ { proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header Origin $http_origin; }
  location / { try_files $uri $uri/ /index.html; }
}
