name: fluentcoach
services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: fluentcoach
      POSTGRES_USER: fluentcoach
      POSTGRES_PASSWORD: local-development-only
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U fluentcoach -d fluentcoach"], interval: 3s, timeout: 3s, retries: 20 }
  redis:
    image: redis:8.2.1-alpine3.22
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    ports: ["6379:6379"]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 3s, timeout: 3s, retries: 20 }
  migrate:
    build: { context: ., target: migrate }
    user: node
    command: ["packages/infrastructure/node_modules/.bin/prisma", "migrate", "deploy", "--schema", "packages/infrastructure/prisma/schema.prisma"]
    environment: { DATABASE_URL: "postgresql://fluentcoach:local-development-only@postgres:5432/fluentcoach" }
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  api:
    build: { context: ., target: api }
    environment: { NODE_ENV: development, API_PORT: 3000, BILLING_MODE: free_only, PUBLIC_ORIGIN: "http://localhost:8080", DATABASE_URL: "postgresql://fluentcoach:local-development-only@postgres:5432/fluentcoach", REDIS_URL: "redis://redis:6379" }
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    healthcheck: { test: [CMD, wget, -qO-, http://127.0.0.1:3000/health/ready], interval: 3s, timeout: 3s, retries: 20 }
  worker:
    build: { context: ., target: worker }
    environment: { NODE_ENV: development, WORKER_HEALTH_PORT: 3001, BILLING_MODE: free_only, DATABASE_URL: "postgresql://fluentcoach:local-development-only@postgres:5432/fluentcoach", REDIS_URL: "redis://redis:6379" }
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck: { test: [CMD, wget, -qO-, http://127.0.0.1:3001/health/ready], interval: 3s, timeout: 3s, retries: 20 }
  web:
    build: { context: ., target: web }
    ports: ["8080:8080"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck: { test: [CMD, wget, -qO-, http://127.0.0.1:8080/health/live], interval: 3s, timeout: 3s, retries: 20 }
volumes:
  postgres-data:
  redis-data:
