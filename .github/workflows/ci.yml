name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:boundaries
      - run: pnpm build
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: pnpm exec prisma validate --schema packages/infrastructure/prisma/schema.prisma
        env: { DATABASE_URL: "postgresql://fluentcoach:local-development-only@localhost:5432/fluentcoach" }
      - run: pnpm db:migrate:test
        env: { DATABASE_URL: "postgresql://fluentcoach:local-development-only@localhost:5432/fluentcoach" }
      - run: pnpm test:integration:identity
        env: { DATABASE_URL: "postgresql://fluentcoach:local-development-only@localhost:5432/fluentcoach" }
      - run: pnpm test:integration:sessions
        env: { DATABASE_URL: "postgresql://fluentcoach:local-development-only@localhost:5432/fluentcoach" }
      - run: pnpm test:contract:ai
      - run: pnpm test:integration:jobs
        env: { DATABASE_URL: "postgresql://fluentcoach:local-development-only@localhost:5432/fluentcoach" }
      - run: pnpm test:resilience:jobs
        env: { DATABASE_URL: "postgresql://fluentcoach:local-development-only@localhost:5432/fluentcoach" }
      - run: docker compose stop api web worker
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:onboarding
        env:
          DATABASE_URL: "postgresql://fluentcoach:local-development-only@localhost:5432/fluentcoach"
          REDIS_URL: "redis://localhost:6379"
          BILLING_MODE: free_only
      - run: pnpm test:e2e:conversation
        env:
          DATABASE_URL: "postgresql://fluentcoach:local-development-only@localhost:5432/fluentcoach"
          REDIS_URL: "redis://localhost:6379"
          BILLING_MODE: free_only
      - run: pnpm test:smoke
      - if: always()
        run: docker compose logs --no-color && docker compose down --volumes
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t fluentcoach-api:${{ github.sha }} .
      - run: docker build --target worker -t fluentcoach-worker:${{ github.sha }} .
      - run: docker build --target web -t fluentcoach-web:${{ github.sha }} .
